# Bitta domen: sayt (SPA) + /api va /admin → Next.js backend.
# Shunda sessiya cookie bir domenda (SameSite=Lax), CORS kerak emas.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 210m;  # bitta video — 200 MB gacha (MAX_VIDEO_MB)

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Fayl yuklash: tanani buferlamasdan to‘g‘ridan-to‘g‘ri backendga oqim bilan
  location = /api/v1/uploads {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Real-vaqt bildirishnomalar (SSE): buferlash o‘chiq, ulanish uzoq yashaydi
  location = /api/v1/notifications/stream {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Service worker har doim yangisi olinsin
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~ ^/(api|admin|_next|icon\.svg) {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hash’langan fayllar — uzoq kesh
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: noma’lum yo‘llar index.html ga
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
