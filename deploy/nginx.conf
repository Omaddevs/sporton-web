# Bitta domen: sayt (SPA) + /api, /admin, /kabinet → Next.js backend.
# Shunda sessiya cookie bir domenda (SameSite=Lax), CORS kerak emas.

# Ijtimoiy tarmoq va qidiruv botlari: SPA o‘rniga meta teglari bor HTML beriladi (backend /api/v1/seo)
map $http_user_agent $seo_bot {
  default 0;
  ~*(googlebot|bingbot|yandex|baiduspider|duckduckbot|telegrambot|facebookexternalhit|facebot|twitterbot|linkedinbot|whatsapp|slackbot|discordbot|vkshare|applebot|pinterest|skypeuripreview) 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 210m;  # bitta video — 200 MB gacha (MAX_VIDEO_MB)

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;

  include /etc/nginx/snippets/security-headers.conf;

  # Fayl yuklash: tanani buferlamasdan to‘g‘ridan-to‘g‘ri backendga oqim bilan
  location = /api/v1/uploads {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Real-vaqt bildirishnomalar (SSE): buferlash o‘chiq, ulanish uzoq yashaydi
  location = /api/v1/notifications/stream {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Service worker har doim yangisi olinsin
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Sitemap backendda (bazadagi majmua, yangilik va tadbirlardan yig‘iladi)
  location = /sitemap.xml {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Botlar uchun meta sahifa (ichki manzil — tashqaridan to‘g‘ridan-to‘g‘ri chaqirilmaydi)
  location = /__seo {
    internal;
    proxy_pass http://backend:3001/api/v1/seo?path=$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Next.js: API, admin panel, majmua egasi kabineti va ularning statik fayllari.
  # CSP va boshqa sarlavhalarni Next.js o‘zi qo‘yadi.
  location ~ ^/(api|admin|kabinet|_next|icon\.svg) {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hash’langan fayllar — uzoq kesh
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Sayt rasmlari (public/images) — nomi hash’lanmagan, shuning uchun 7 kun + fonda yangilash
  location ^~ /images/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    try_files $uri =404;
  }

  # SPA: noma’lum yo‘llar index.html ga; botlarga — meta teglari bor sahifa
  location / {
    if ($seo_bot) {
      rewrite ^ /__seo last;
    }
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
