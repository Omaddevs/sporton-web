# Har bir location’da include qilinadi: nginx’da location ichidagi add_header server darajasidagilarni
# bekor qiladi, shuning uchun xavfsizlik sarlavhalari shu yerda bir joyda saqlanadi.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
# HTTPS (TLS proksi orqasida) ishga tushgach yoqing:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Sayt (SPA) uchun CSP. Admin va kabinet o‘z CSP’sini Next.js’dan oladi (backend/next.config.ts).
# Inline skript yo‘q (mavzu skripti — /theme-init.js). Google/Telegram kirishi yoqilsa script-src ga qo‘shing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://accounts.google.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.instagram.com https://accounts.google.com https://oauth.telegram.org https://www.google.com https://yandex.uz; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
