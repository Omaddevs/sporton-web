# Production: docker compose up -d --build
# Birinchi marta:  docker compose run --rm backend npm run db:setup
#                  docker compose run --rm -e ADMIN_PHONE=... -e ADMIN_PASSWORD=... backend npm run admin:create
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sporton
      POSTGRES_USER: sporton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ni .env da kiriting}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sporton']
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sporton:${POSTGRES_PASSWORD}@db:5432/sporton
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET ni .env da kiriting}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-SportOnUzBot}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:info@sporton.uz}
    volumes:
      - uploads:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_TELEGRAM_BOT: ${TELEGRAM_BOT_USERNAME:-SportOnUzBot}
        VITE_TELEGRAM_BOT_ID: ${VITE_TELEGRAM_BOT_ID:-}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - '${HTTP_PORT:-80}:80'

volumes:
  pgdata:
  uploads:
