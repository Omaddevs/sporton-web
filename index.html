<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sporton-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Montserrat:wght@800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="description" content="SportON — sport majmualarini topish va bron qilish, mashg&#39;ulotlar, sport yangiliklari va tadbirlar bir joyda." />
    <meta name="theme-color" content="#1e6ff5" />
    <style>
      .boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 18px; background: #0b1220; }
      html[data-theme='light'] .boot { background: #f5f7fb; }
      .boot img { animation: boot-pulse 1.4s ease-in-out infinite; }
      .boot__bar { width: 120px; height: 4px; border-radius: 4px; background: rgb(30 111 245 / 0.18); overflow: hidden; }
      .boot__bar span { display: block; width: 40%; height: 100%; border-radius: inherit; background: #1e6ff5; animation: boot-slide 1.1s ease-in-out infinite; }
      .boot__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      @keyframes boot-pulse { 50% { transform: scale(0.94); opacity: 0.8; } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .boot img, .boot__bar span { animation: none; } }
    </style>
    <title>SportON — Sport majmualari, bron va mashg&#39;ulotlar</title>
  </head>
  <body>
    <div id="root">
      <!-- Ilova yuklanguncha ko‘rinadi; React render bo‘lganda almashtiriladi -->
      <div class="boot" role="status" aria-live="polite">
        <img src="/images/logo-icon.svg" alt="" width="56" height="56" />
        <span class="boot__bar"><span></span></span>
        <span class="boot__sr">SportON yuklanmoqda…</span>
      </div>
    </div>
    <noscript>SportON ishlashi uchun brauzeringizda JavaScript yoqilgan bo‘lishi kerak.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
